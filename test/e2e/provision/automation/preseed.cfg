d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string America/Los_Angeles
d-i clock-setup/utc boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Isoboot User
d-i passwd/username string isoboot
d-i passwd/user-password-crypted password {{ index .ConfigMaps "default_user.password" }}
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server curl
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i preseed/early_command string wget -q -O /dev/null --post-data="provisionName={{.ProvisionName}}&phase=InProgress" "{{.UpdatePhaseURL}}" || true
d-i preseed/late_command string in-target mkdir -p /home/isoboot/.ssh && echo '{{ index .ConfigMaps "default_user.ssh_public_key" }}' > /target/home/isoboot/.ssh/authorized_keys && in-target chmod 700 /home/isoboot/.ssh && chmod 600 /target/home/isoboot/.ssh/authorized_keys && in-target chown -R isoboot:isoboot /home/isoboot/.ssh && echo '{{ index .Secrets "ssh_host_ecdsa_key_b64" }}' | base64 -d > /target/etc/ssh/ssh_host_ecdsa_key && chmod 600 /target/etc/ssh/ssh_host_ecdsa_key && in-target ssh-keygen -y -f /etc/ssh/ssh_host_ecdsa_key > /target/etc/ssh/ssh_host_ecdsa_key.pub && chmod 644 /target/etc/ssh/ssh_host_ecdsa_key.pub && echo '{{ index .Secrets "ssh_host_ed25519_key_b64" }}' | base64 -d > /target/etc/ssh/ssh_host_ed25519_key && chmod 600 /target/etc/ssh/ssh_host_ed25519_key && in-target ssh-keygen -y -f /etc/ssh/ssh_host_ed25519_key > /target/etc/ssh/ssh_host_ed25519_key.pub && chmod 644 /target/etc/ssh/ssh_host_ed25519_key.pub && echo '{{ index .Secrets "ssh_host_rsa_key_b64" }}' | base64 -d > /target/etc/ssh/ssh_host_rsa_key && chmod 600 /target/etc/ssh/ssh_host_rsa_key && in-target ssh-keygen -y -f /etc/ssh/ssh_host_rsa_key > /target/etc/ssh/ssh_host_rsa_key.pub && chmod 644 /target/etc/ssh/ssh_host_rsa_key.pub && in-target sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config && in-target sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config &&{{- if index .ConfigMaps "machine_id" }} echo '{{ index .ConfigMaps "machine_id" }}' > /target/etc/machine-id && chmod 444 /target/etc/machine-id &&{{- end }} echo '@HOSTNAME@' > /target/etc/hostname && in-target sh -c 'printf "GRUB_CMDLINE_LINUX=\"console=ttyS0,115200\"\n" >> /etc/default/grub' && in-target update-grub && wget -q -O /dev/null --post-data="provisionName={{.ProvisionName}}&phase=Complete" "{{.UpdatePhaseURL}}"
d-i finish-install/reboot_in_progress note
