name: Verify Manifests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Generated files are up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Generate manifests
        run: make manifests generate

      # git status, not git diff: a generated file that was never committed
      # (a new CRD, say) is untracked, and git diff does not show it.
      - name: Check for changed or new generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files are out of date or not committed. Run 'make manifests generate' and commit the result."
            exit 1
          fi
